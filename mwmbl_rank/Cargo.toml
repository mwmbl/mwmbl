[package]
name = "mwmbl_rank"
version = "0.1.0"
edition = "2021"

[lib]
name = "mwmbl_rank"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
xgb = { version = "3.0.5", features = ["use_prebuilt_xgb"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
once_cell = "1"
url = "2"
zstd = "0.13"
mwmbl_core = { version = "0.1.0", path = "../rust/mwmbl_core" }

[build-dependencies]
# The same features as the runtime dependency, so both parse numbers identically.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Vendored xgboost_lib-sys (headers only) that restricts bindgen to the XGBoost C API, so builds
# don't fail on libc layout assertions when libclang is misconfigured. See third_party/xgboost_lib-sys/build.rs.
[patch.crates-io]
xgboost_lib-sys = { path = "third_party/xgboost_lib-sys" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Debug alternative options
# debug = true
# opt-level = 1
# lto = false
# codegen-units = 1
# panic = "abort" # Simplifies the call stack by removing unwinding logic


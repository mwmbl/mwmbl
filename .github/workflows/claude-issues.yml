name: Claude issue automation

# Turns triaged issues into pull requests, as soon as they are ready.
#
#   "ready to plan"  ->  a PR adding docs/plans/issue-<N>-<slug>.md and nothing else
#   "ready to code"  ->  a PR implementing the issue (or a plan, if it is too big for one)
#   a plan on main   ->  one PR per unfinished "## PR <k>:" section, in order
#
# Only one claude/issue-<N>-* pull request is ever open per issue: the next part starts
# after the previous one is merged. See .github/claude/*.md for what Claude is told, and
# docs/plans/README.md for the plan format.
#
# Both jobs authenticate with the CLAUDE_CODE_OAUTH_TOKEN secret, a one-year token from
# `claude setup-token`. It runs against a Claude subscription rather than API credit, so
# these runs share the usage windows of an interactive session, and the token has to be
# regenerated when it expires.
#
# Note that an issue only enters these queues once someone with write access labels it,
# so untriaged issue text never reaches a run. That gate is what makes an unrestricted
# Bash tool below reasonable: the runner is ephemeral, but it holds an API key and a
# repository token, so nothing unreviewed should ever reach it.

on:
  # Both queues are pure functions of repository state, so the triggers are the events
  # that can change that state: a triage label going on an issue, and a pull request
  # merging (a plan, or a part that frees its issue for the next one).
  issues:
    types: [labeled]
  # Not `push`: claude-code-action rejects that event outright ("Unsupported event type:
  # push"), which failed every job on every merge to main. A merged pull request is the
  # state change we actually care about anyway — a plan landing, or a part freeing its
  # issue for the next one — and it is an event the action accepts.
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue:
        description: "Act on this issue number only (blank = every eligible issue)"
        required: false
        type: string
  schedule:
    # A safety net, not the cadence. GitHub dispatches schedule events off a shared,
    # best-effort queue and drops them under load: every scheduled run this repository
    # has had arrived between 40 minutes and 6 hours late, so an hourly cron fired
    # exactly never. The triggers above are what keep the queue moving; this is only
    # here to pick up work whose event was missed.
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # OIDC exchange for the Claude GitHub App
  actions: read

env:
  # How many issues may be worked on in one run, implement items first.
  CLAUDE_MAX_ITEMS: "3"

jobs:
  select:
    runs-on: ubuntu-latest
    # Only the two triage labels start work; every other label edit is noise.
    if: >-
      (github.event_name != 'issues'
        || github.event.label.name == 'ready to plan'
        || github.event.label.name == 'ready to code')
      && (github.event_name != 'pull_request' || github.event.pull_request.merged)
    # A run of merges should produce one selection rather than one per merge. A superseded
    # selection has not started any work yet, so cancelling it costs nothing; a targeted
    # workflow_dispatch gets its own group so a merge cannot cancel it.
    concurrency:
      group: claude-issue-select-${{ inputs.issue || 'all' }}
      cancel-in-progress: true
    outputs:
      plan_matrix: ${{ steps.select.outputs.plan_matrix }}
      implement_matrix: ${{ steps.select.outputs.implement_matrix }}
      has_plan: ${{ steps.select.outputs.has_plan }}
      has_implement: ${{ steps.select.outputs.has_implement }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # Read-only listing, so the default workflow token is enough here.
      - name: Select the issues to act on
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_ONLY_ISSUE: ${{ inputs.issue }}
        run: .github/scripts/select-claude-work.sh

  plan:
    needs: select
    if: needs.select.outputs.has_plan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.plan_matrix) }}
    # Never two runs on one issue at once; a queued duplicate exits early when it sees
    # the pull request the first one opened.
    concurrency:
      group: claude-issue-${{ matrix.item.issue }}
      cancel-in-progress: false
    name: "plan #${{ matrix.item.issue }}"

    # A plan is only as good as the facts behind it, so give the planning run the same
    # environment as the implementing one: it can then count lint violations, run the
    # suite and check what actually breaks, rather than estimating from a read.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mwmbl
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # Full history: the instructions diff the branch against main.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up the project
        uses: ./.github/actions/setup-project
      # No github_token input: the action then authenticates as the Claude GitHub App,
      # which sets GH_TOKEN and the git credentials for Claude and, unlike the workflow
      # token, lets CI run on the pull requests it pushes.
      - name: Write the plan
        uses: anthropics/claude-code-action@v1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_mwmbl
          DJANGO_SETTINGS_MODULE: mwmbl.settings_test
        with:
          # A subscription token from `claude setup-token`, not a Console API key: these
          # runs draw on the same subscription as an interactive session, so they share
          # its usage windows.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: |
            Follow the instructions in .github/claude/plan-issue.md exactly.

            ISSUE_NUMBER: ${{ matrix.item.issue }}
            ISSUE_TITLE: ${{ matrix.item.title }}
            REPOSITORY: ${{ github.repository }}
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,TodoWrite,Bash"

  implement:
    needs: select
    if: needs.select.outputs.has_implement == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.implement_matrix) }}
    concurrency:
      group: claude-issue-${{ matrix.item.issue }}
      cancel-in-progress: false
    name: "implement #${{ matrix.item.issue }}"

    # Claude has to get the same gates green before it opens a pull request as CI runs
    # afterwards, so it needs the same database and toolchain as ci.yml's test job.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mwmbl
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up the project
        uses: ./.github/actions/setup-project
      - name: Implement the next part
        uses: anthropics/claude-code-action@v1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_mwmbl
          DJANGO_SETTINGS_MODULE: mwmbl.settings_test
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: |
            Follow the instructions in .github/claude/implement-issue.md exactly.

            ISSUE_NUMBER: ${{ matrix.item.issue }}
            ISSUE_TITLE: ${{ matrix.item.title }}
            REPOSITORY: ${{ github.repository }}
          claude_args: |
            --model claude-opus-5
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,Write,TodoWrite,Bash"

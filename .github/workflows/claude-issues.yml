name: Claude issue automation

# Turns triaged issues into pull requests, and keeps the pull requests it opened moving.
#
# A run picks up one issue and decides what it needs — write a plan, build the next part,
# answer a review, fix red checks, rebase, answer a question, ask one, or file what it
# found and should not fix here — then does it, has it reviewed in a fresh context, and
# pushes it. Changing no code is a normal outcome, and one a run says out loud rather than
# ending in silence.
#
# There is one Claude step, and it is an ordinary Claude Code session with GitHub as its
# interface rather than a person. It reads the issue, does the work, spawns the review as a
# subagent that starts cold and commits its own findings, pushes, and opens or comments on
# the pull request. .github/claude/run.md is the whole of what it is told.
#
# The only shell left is what a run cannot do for itself. Choosing which issues are worth
# spending a run on has to happen before any model starts, so it is
# .github/scripts/select-claude-work.sh. Saying how the job ended has to happen when the
# model may not have run at all, so it is .github/scripts/classify-claude-run.sh. Nothing
# in between: a step that re-ran the gates or re-read the diff would be checking a session
# that is already reporting on itself, and CI on the pushed branch is what actually catches
# a change the run got wrong. See docs/plans/README.md for the plan format the queues are
# derived from.
#
# Only one claude/issue-<N>-* pull request is ever open per issue. It no longer blocks the
# issue, though: while it is open the only thing the automation may do to that issue is
# answer what is holding the pull request up, which is what a human is actually waiting on.
#
# The Claude step authenticates with the CLAUDE_CODE_OAUTH_TOKEN secret, a one-year token
# from `claude setup-token`. It runs against a Claude subscription rather than API credit, so
# these runs share the usage windows of an interactive session, and the token has to be
# regenerated when it expires. A run that finds the window spent ends green and stays
# queued; see .github/scripts/classify-claude-run.sh.
#
# Note that an issue only enters these queues once someone with write access labels it, and
# only a maintainer's review or comment wakes a run on a pull request, so untriaged text
# never reaches a run. That gate is what makes an unrestricted Bash tool below reasonable:
# the runner is ephemeral, but it holds an API key and a repository token, so nothing
# unreviewed should ever reach it.

on:
  # The queues are pure functions of repository state, so the triggers are the events that
  # can change that state. Not `push`: claude-code-action rejects that event outright
  # ("Unsupported event type: push"), which is what failed every job on every merge to main
  # between a5eb9e3 and 141ae84.
  issues:
    types: [labeled, edited, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  # CI going red on a branch the automation owns is a state change it can act on without
  # waiting for a human to notice.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue:
        description: "Act on this issue number only (blank = every eligible issue)"
        required: false
        type: string
  schedule:
    # A safety net, not the cadence. GitHub dispatches schedule events off a shared,
    # best-effort queue and drops them under load: every scheduled run this repository
    # has had arrived between 40 minutes and 6 hours late, so an hourly cron fired
    # exactly never. The triggers above are what keep the queue moving; this is what
    # picks up work whose event was missed, and work that stopped because the
    # subscription's usage window was spent.
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # OIDC exchange for the Claude GitHub App
  actions: read

env:
  # How many issues may be worked on in one run.
  CLAUDE_MAX_ITEMS: "3"

jobs:
  select:
    runs-on: ubuntu-latest
    # Which events are worth a selection at all. Everything here is about not starting a
    # run: the selector re-derives the whole queue from repository state regardless of
    # what woke it, so a trigger that gets through costs one cheap job and nothing more.
    #
    # The author checks matter for more than noise. Feedback from someone without write
    # access must never be able to start a run on a public repository, so a comment or
    # review only counts from an OWNER, MEMBER or COLLABORATOR, and never from a bot —
    # which is also what stops the automation waking itself with its own comments. The
    # login test belongs on all three, and carries that second job alone: every comment a
    # run posts is posted as the Claude app, which raises an event the way a person's does,
    # and author_association is not a reliable way to recognise an app. Webhook payloads
    # give an app the "[bot]" suffix even though the GraphQL API does not, which is why the
    # test can live here and not in the selector.
    #
    # A pull request from a fork is out of scope for the same reason, and for a practical
    # one: GitHub gives a fork's pull_request event no secrets and a read-only token
    # whatever the permissions block above says, so CLAUDE_CODE_OAUTH_TOKEN would be
    # empty, every Claude step would fail and the classifier's label write would 403.
    if: >-
      (github.event_name != 'issues' || github.event.action != 'labeled'
        || github.event.label.name == 'ready to plan'
        || github.event.label.name == 'ready to code')
      && (github.event_name != 'pull_request'
        || (github.event.pull_request.merged
            && github.event.pull_request.head.repo.full_name == github.repository))
      && (github.event_name != 'issue_comment'
        || (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
            && !endsWith(github.event.comment.user.login, '[bot]')))
      && (github.event_name != 'pull_request_review'
        || (startsWith(github.event.pull_request.head.ref, 'claude/')
            && github.event.pull_request.head.repo.full_name == github.repository
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
            && !endsWith(github.event.review.user.login, '[bot]')))
      && (github.event_name != 'pull_request_review_comment'
        || (startsWith(github.event.pull_request.head.ref, 'claude/')
            && github.event.pull_request.head.repo.full_name == github.repository
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
            && !endsWith(github.event.comment.user.login, '[bot]')))
      && (github.event_name != 'workflow_run'
        || (github.event.workflow_run.conclusion == 'failure'
            && startsWith(github.event.workflow_run.head_branch, 'claude/')))
    # A burst of events should produce one selection rather than one each. A superseded
    # selection has not started any work yet, so cancelling it costs nothing; a targeted
    # workflow_dispatch gets its own group so nothing else can cancel it.
    concurrency:
      group: claude-issue-select-${{ inputs.issue || 'all' }}
      cancel-in-progress: true
    outputs:
      items_matrix: ${{ steps.select.outputs.items_matrix }}
      has_items: ${{ steps.select.outputs.has_items }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
      # Read-only listing, so the default workflow token is enough here.
      - name: Select the work to act on
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_ONLY_ISSUE: ${{ inputs.issue }}
        run: .github/scripts/select-claude-work.sh

  work:
    needs: select
    if: needs.select.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    # One Claude run and the review subagent inside it, both iterating on a 67-second test
    # suite.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.items_matrix) }}
    # Never two runs on one issue at once.
    concurrency:
      group: claude-issue-${{ matrix.item.issue }}
      cancel-in-progress: false
    name: "#${{ matrix.item.issue }} ${{ matrix.item.kind }}"

    # Claude has to get the same gates green before it pushes as CI runs on the branch
    # afterwards, so it needs the same database and toolchain as ci.yml's test job. The
    # planning run gets it too: a plan is only as good as the facts behind it, and this
    # lets it count lint violations and see what actually breaks rather than estimating.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mwmbl
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ISSUE_NUMBER: ${{ matrix.item.issue }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_mwmbl
      DJANGO_SETTINGS_MODULE: mwmbl.settings_test

    steps:
      # The log lives outside the checkout. The run holds an unrestricted Bash tool and is
      # asked to commit; a file sitting untracked in the working tree is one `git add -A`
      # away from being part of the pull request.
      #
      # It is set here rather than in the job's `env` above because the `runner` context
      # does not exist at job level: a `${{ runner.temp }}` there is not an empty string but
      # a workflow that fails to validate, which is what broke every run from 2f0de72 on.
      - name: Point the run log outside the checkout
        run: echo "CLAUDE_RUN_LOG=$RUNNER_TEMP/claude-runs.jsonl" >>"$GITHUB_ENV"
      # Full history: the run diffs the branch against main and pushes it.
      #
      # The ref is pinned because `pull_request` hands github.ref as refs/pull/<n>/merge:
      # a ref GitHub stops guaranteeing once the pull request closes, and a snapshot of a
      # merge that is not main even when it does resolve. Every other trigger here already
      # resolves to the default branch, and workflow_dispatch keeps the branch it was
      # dispatched on so this pipeline can be tested from one.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
          fetch-depth: 0
      - name: Set up the project
        uses: ./.github/actions/setup-project

      # No github_token input: the action then authenticates as the Claude GitHub App,
      # which sets GH_TOKEN and the git credentials for Claude and, unlike the workflow
      # token, lets CI run on the pull requests it pushes. That is the whole reason the run
      # can push for itself — a branch pushed with GITHUB_TOKEN would sit with no checks on
      # it forever, and CI going red is how the selector learns a change was wrong.
      #
      # continue-on-error, so that the last step can classify how the run ended rather than
      # the job dying here with no explanation.
      - name: Work on the issue
        id: run
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          # A subscription token from `claude setup-token`, not a Console API key: these
          # runs draw on the same subscription as an interactive session, so they share
          # its usage windows.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A workflow_run event carries the actor of the run that failed, which on a
          # claude/* branch is the app itself. The workflow's own `if` above is what keeps
          # untrusted actors out.
          allowed_bots: claude
          display_report: true
          prompt: |
            Follow the instructions in .github/claude/run.md exactly.

            ISSUE_NUMBER: ${{ matrix.item.issue }}
            ISSUE_TITLE: ${{ matrix.item.title }}
            ITEM_KIND: ${{ matrix.item.kind }}
            PULL_REQUEST: ${{ matrix.item.pr }}
            REASON: ${{ matrix.item.reason }}
            REPOSITORY: ${{ github.repository }}
          # Agent is the subagent tool section 4 of run.md needs; Task is what older
          # releases of the CLI called it, and a name that matches nothing is inert.
          claude_args: |
            --model claude-opus-5
            --max-turns 150
            --allowedTools "Read,Glob,Grep,Edit,Write,TodoWrite,Bash,Agent,Task"
      - name: Record the run
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
          EXECUTION_FILE: ${{ steps.run.outputs.execution_file }}
        run: .github/scripts/record-claude-run.sh run

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-run-${{ matrix.item.issue }}
          path: ${{ runner.temp }}/claude-runs.jsonl
          if-no-files-found: ignore

      - name: Report how the run ended
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/classify-claude-run.sh

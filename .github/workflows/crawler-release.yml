name: Release the crawler Docker image

# Raising CRAWLER_VERSION in mwmbl/crawler/version.py on main publishes mwmbl/crawler:X.Y.Z,
# :X.Y, :stable and :latest, then tags the commit crawler-vX.Y.Z. :latest moves with releases
# rather than with every merge, so existing setups pulling the untagged image get each
# release and nothing in between. CI fails a pull request that changes the crawler without
# raising the version, so every crawler change reaches a release.
on:
  push:
    branches: [main]
    paths:
      - mwmbl/crawler/version.py

# Two merges in quick succession must not race to publish :stable out of order. GitHub keeps
# one pending run per group, so a third bump arriving while one runs and one waits cancels
# the waiting one: that version is skipped and never tagged, but :stable still ends on the
# newest.
concurrency:
  group: crawler-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read CRAWLER_VERSION
        id: version
        run: |
          version=$(python3 -c "import runpy; print(runpy.run_path('mwmbl/crawler/version.py')['CRAWLER_VERSION'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      # An edit to version.py that leaves the version alone, or a revert to an older one,
      # must not move :stable.
      - name: Check the version is not already released
        id: released
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/crawler-v${{ steps.version.outputs.version }}"; then
            echo "Crawler ${{ steps.version.outputs.version }} is already released"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.released.outputs.released != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.released.outputs.released != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.released.outputs.released != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.released.outputs.released != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.crawler
          push: true
          tags: |
            mwmbl/crawler:${{ steps.version.outputs.version }}
            mwmbl/crawler:${{ steps.version.outputs.minor }}
            mwmbl/crawler:stable
            mwmbl/crawler:latest
          platforms: linux/amd64,linux/arm64

      # Tagged only after the push succeeds, so an existing tag means a published image.
      - name: Tag the release
        if: steps.released.outputs.released != 'true'
        run: |
          git tag "crawler-v${{ steps.version.outputs.version }}"
          git push origin "crawler-v${{ steps.version.outputs.version }}"

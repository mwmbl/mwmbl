name: Crawler smoke

# Builds the crawler image and runs it, which nothing else in CI does. Two failures came
# from that gap: the image stopped building when Debian bullseye went end of life (#380),
# and before that the container crash-looped on an import that reached Django too early
# (#360). Both were only noticed after they had landed on main.
#
# The crawler runs against a stand-in for the Mwmbl API (.github/scripts/crawler_smoke_server.py),
# so nothing reaches the production index: it crawls the web until it submits its first
# batch, the stand-in checks the batch and answers with a curated result, and the run passes
# once the crawler has merged that answer into its index. The crawler never exits by itself,
# so the run is bounded by time instead.
#
# The schedule matters as much as the pull request trigger: the bullseye expiry broke the
# build with no commit to blame, and only a scheduled run catches that kind of breakage
# before someone's unrelated push does.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"  # 05:00 UTC every Monday
  workflow_dispatch:

# A push to a pull request supersedes the run already going for it. Without this each
# force-push leaves a full image build running for a commit that no longer exists.
# Runs on main and on the schedule are never cancelled - those are the ones we act on.
concurrency:
  group: crawler-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Load the image into the local daemon instead of pushing it: this job only needs to
      # run it. Single platform, because the run is what we are testing and the multi-arch
      # build already happens on the publish workflow.
      - name: Build the crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.crawler
          push: false
          load: true
          tags: mwmbl/crawler:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crawl until the first batch is submitted and synced
        run: |
          python3 .github/scripts/crawler_smoke_server.py 8765 > stand-in.log 2>&1 &
          docker run -d --name crawler --network host \
            -e MWMBL_API_KEY=smoke \
            -e MWMBL_CONTACT_INFO=ci@mwmbl.org \
            -e MWMBL_REMOTE_SERVER=http://127.0.0.1:8765 \
            mwmbl/crawler:smoke
          synced=false
          for _ in $(seq 120); do
            if docker logs crawler 2>&1 | grep -q "Results sendt"; then
              synced=true
              break
            fi
            [ "$(docker inspect -f '{{.State.Running}}' crawler)" = true ] || break
            sleep 5
          done
          docker logs crawler 2>&1 | grep -v "^speed:" | tail -50
          docker rm -f crawler
          cat stand-in.log
          if grep -q "::error::" stand-in.log; then
            exit 1
          fi
          if [ "$synced" != true ]; then
            echo "::error::The crawler did not submit and sync a batch within ten minutes"
            exit 1
          fi

[package]
name = "mwmbl_core"
version = "0.1.0"
edition = "2024"


[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
zstd = "0.13"
anyhow = { version = "1.0.104" }
phf = { version = "0.14.0", features = ["macros"] }
regex = { version = "1.13.1" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
murmurhash32 = "0.4.0"
itertools = "0.15.0"
file-guard = "0.2.0"
ordered-float = "5.5.1"

[build-dependencies]
# The same features as the runtime dependency, so both parse numbers identically.
serde_json = { version = "1", features = ["float_roundtrip"] }



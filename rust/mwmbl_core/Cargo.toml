[package]
name = "mwmbl_core"
version = "0.1.0"
edition = "2024"

# Only what index.rs needs: mwmbl_rank links this crate into the server's extension, so
# every dependency here is compiled into the server. Keep the versions in step with
# mwmbl_rank's, or two copies of each get linked.
[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
zstd = "0.13"

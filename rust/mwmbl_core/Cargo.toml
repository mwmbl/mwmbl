[package]
name = "mwmbl_core"
version = "0.1.0"
edition = "2024"

# mwmbl_rank links this crate into the server's Python extension with default features, so
# only what index.rs needs is a non-optional dependency. Keep serde_json and zstd in step
# with mwmbl_rank's versions, or two copies of each get linked.
#
# The `crawler` feature adds the modules only the Rust crawler (rust/crawler) uses. Nothing
# in production runs that yet.
[features]
default = []
crawler = ["dep:anyhow", "dep:phf", "dep:regex", "dep:reqwest", "dep:serde", "dep:tokio"]

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
zstd = "0.13"

anyhow = { version = "1.0.104", optional = true }
phf = { version = "0.14.0", features = ["macros"], optional = true }
regex = { version = "1.13.1", optional = true }
reqwest = { version = "0.13.5", features = ["json"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }

[package]
name = "crawler_rs"
version = "2.0.2"
edition = "2024"

[features]
default = []
servo = ["dep:servo-fetch"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dom_query = { version = "0.29.0", features = ["atomic", "hashbrown", "mini_selector"] }
fastbloom = { version = "0.17.0", features = ["serde"] }
futures-util = "0.3.34"
hickory-resolver = "0.26.3"
itertools = "0.15.0"
kreuzberg = { version = "4.10.4", features = ["html", "pdf", "bundled-pdfium"] }
mwmbl_core = { version = "0.1.0", path = "../mwmbl_core" }
ordered-float = "5.5.1"
postcard = { version = "1.1.3", features = ["use-std"] }
priority-queue = "2.7.0"
rand = "0.10.3"
readabilityrs = "0.1.4"
reqwest = { version = "0.13.5", features = ["json", "gzip", "brotli", "zstd", "deflate", "stream", "hickory-dns"] }
scc = "3.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
servo-fetch = { version = "0.15.2", optional = true }
strum = "0.28.0"
strum_macros = "0.28.0"
texting_robots = "0.2.2"
tokio = { version = "1.54.1", features = ["full", "tracing"] }
urlencoding = "2.1.3"

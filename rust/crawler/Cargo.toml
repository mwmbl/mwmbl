[package]
name = "crawler_rs"
version = "2.0.0"
edition = "2024"

[features]
default = []
servo = ["dep:servo-fetch"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
dom_query = { version = "0.29.0", features = ["atomic", "hashbrown", "mini_selector"] }
futures-util = "0.3.34"
human_regex = "0.3.1"
kreuzberg = { version = "4.10.4", features = ["html", "pdf", "bundled-pdfium"] }
markdown = "1.0.0"
mwmbl_core = { version = "0.1.0", path = "../mwmbl_core", features = ["crawler"] }
ordered-float = "5.5.1"
priority-queue = "2.7.0"
rand = "0.10.3"
readabilityrs = "0.1.4"
reqwest = { version = "0.13.5", features = ["json", "gzip", "brotli", "zstd", "deflate", "stream"] }
scc = "3.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
servo-fetch = { version = "0.15.2", optional = true }
stop-words = { version = "0.10.1" }
texting_robots = "0.2.2"
tokio = { version = "1.54.1", features = ["full"] }
urlencoding = "2.1.3"

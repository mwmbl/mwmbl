[package]
name = "crawler_rs"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
mwmbl_core = { version = "0.1.0", path = "../mwmbl_core" }
# redis = "1.8.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
urlencoding = "2.1.3"

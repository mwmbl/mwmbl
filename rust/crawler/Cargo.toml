[package]
name = "crawler_rs"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
futures-util = "0.3.34"
mwmbl_core = { version = "0.1.0", path = "../mwmbl_core", features = ["crawler"] }
ordered-float = "5.5.1"
priority-queue = "2.7.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "gzip", "brotli", "zstd", "deflate", "stream"] }
scc = "3.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
texting_robots = "0.2.2"
tokio = { version = "1.54.1", features = ["full"] }
urlencoding = "2.1.3"

# Compose file for the crawler only, look at 'docker-compose-server.yml' for server compose file
services:
  mwmbl-crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    image: mwmbl/crawler:stable
    container_name: mwmbl-crawler
    pull_policy: always
    # can be used to communicate with a index on the same local machine
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # REQUIRED: API key
      - MWMBL_API_KEY=${MWMBL_API_KEY}
      - MWMBL_REMOTE_SERVER=${MWMBL_REMOTE_SERVER:-https://api.mwmbl.org}
      # REQUIRED: Contact info for website administrators
      - MWMBL_CONTACT_INFO=${MWMBL_CONTACT_INFO}

      # See `mwmbl-crawl --help`. Each has the crawler's own default.
      # Threads running the crawl.
      - CRAWL_THREADS=${CRAWL_THREADS:-8}
      # Threads parsing pages.
      - BLOCKING_THREADS=${BLOCKING_THREADS:-4}
      # Threads reading and writing the local index.
      - INDEX_THREADS=${INDEX_THREADS:-2}
      # Pages fetched at once.
      - CRAWL_MAX_TASKS=${CRAWL_MAX_TASKS:-16}
      # Batches of results submitted at once.
      - SUBMIT_MAX_TASKS=${SUBMIT_MAX_TASKS:-4}
      - CRAWL_DELAY_SECONDS=${CRAWL_DELAY_SECONDS:-0.0}
      # Empty: a random name is generated and kept in the data volume. Set it to name your crawler.
      - MWMBL_DEVICE_NAME=${MWMBL_DEVICE_NAME:-}
    volumes:
      - crawler_data:/home/mwmbl/.mwmbl
    # Compose applies deploy.restart_policy in swarm mode only, so what was here was no
    # restart policy at all: a crawler that exited stayed exited. One did, for three days.
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # CPU restrictions if needed (deploy.resources.limits compose does apply):
    #     deploy:
    #       resources:
    #         limits:
    #           cpus: '0.50'

volumes:
  crawler_data:

services:
  mwmbl-crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    image: mwmbl/crawler
    container_name: mwmbl-crawler
    pull_policy: always
    depends_on:
      - redis
    environment:
      # REQUIRED: API key
      - MWMBL_API_KEY=${MWMBL_API_KEY}

      # REQUIRED: Contact info for website administrators
      - MWMBL_CONTACT_INFO=${MWMBL_CONTACT_INFO}

      # Set value of ./mwmbl/crawler/env_vars.py
      - CRAWLER_WORKERS=4
      - CRAWLER_THREADS=30
      - CRAWL_DELAY_SECONDS=0.0
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
    volumes:
      - crawler_data:/home/mwmbl/.mwmbl
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # CPU restrictions if needed:
    #     resources:
    #       limits:
    #         cpus: '0.50'

  redis:
    image: redis:alpine
    restart: unless-stopped
    # stop-writes-on-bgsave-error no: a failed snapshot otherwise makes Redis reject
    # every write until someone intervenes, which stops the crawler dead. What is in
    # here is a work queue that allkeys-lru is already free to evict, so a snapshot we
    # could not write is worth losing, and carrying on is worth more than the snapshot.
    command: >
      redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
      --stop-writes-on-bgsave-error no
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  crawler_data:
